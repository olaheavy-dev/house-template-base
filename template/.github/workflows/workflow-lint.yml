# Owned by house-template-base. actionlint checks workflow syntax and expressions; zizmor audits
# them for security problems (pedantic persona) and reports to code scanning, where the ruleset's
# "require code scanning results" makes findings block a merge (zizmor exits 0 when writing SARIF).
# Both jobs are required checks, so the workflow runs on every pull request (no paths filter).
name: Workflow lint

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the workflows (actionlint 1.7.12, pinned by image digest)
        run: >-
          docker run --rm --volume "$PWD:/repo" --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload the SARIF report to code scanning
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit the workflows and the Dependabot config
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: "1.31.1"
          persona: pedantic
          advanced-security: true
